<div class="modal-backdrop" (click)="handleBackdropClick($event)">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Edit Chunk</h2>
      <button class="close-btn" (click)="onClose()" title="Close">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
          <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="chunk-meta">
        <div class="meta-item">
          <label>Chunk ID:</label>
          <span class="meta-value">{{ source.chunk_id }}</span>
        </div>
        <div class="meta-item">
          <label>File ID:</label>
          <span class="meta-value">{{ source.file_id }}</span>
        </div>
        <div class="meta-item">
          <label>Filename:</label>
          <span class="meta-value">{{ source.filename }}</span>
        </div>
      </div>

      <div class="text-editor-section">
        <label for="chunk-text">Chunk Text:</label>
        <textarea
          id="chunk-text"
          [(ngModel)]="editText"
          [disabled]="isSaving"
          placeholder="Enter the updated chunk text"
          class="text-editor"
        ></textarea>
      </div>

      <div *ngIf="saveError" class="error-message">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
          <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
          <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
        </svg>
        {{ saveError }}
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="onClose()" [disabled]="isSaving">
        Cancel
      </button>
      <button class="btn-save" (click)="onSave()" [disabled]="isSaving">
        <span *ngIf="!isSaving">Save Changes</span>
        <span *ngIf="isSaving">Saving...</span>
      </button>
    </div>
  </div>
</div>
